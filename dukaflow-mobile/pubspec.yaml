name: dukaflow_mobile
description: "DukaFlow Mobile — Kenya's offline-first retail POS. One codebase, Android + iOS."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State management ─────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Offline-first local DB (MANDATORY offline support) ───────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # ── Networking ───────────────────────────────────────────────
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # ── Hardware & features ──────────────────────────────────────
  mobile_scanner: ^4.0.1           # barcode / QR camera scanner
  esc_pos_utils: ^1.1.0            # ESC/POS thermal command builder
  bluetooth_print: ^4.3.0          # bluetooth thermal printer transport
  local_auth: ^2.2.0               # fingerprint / face ID unlock

  # ── Push notifications (graceful no-op until Firebase config added) ──
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.4

  # ── Misc ─────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.4.0
  qr_flutter: ^4.1.0               # on-screen QR for receipts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
