name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.22
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.3
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build fat APK
        run: flutter build apk --release

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload fat APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dukaflow-mobile-fat-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload split APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dukaflow-mobile-split-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
